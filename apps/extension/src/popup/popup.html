<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        font-size: 13px;
        color: #1f2430;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      #status {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
        line-height: 1.5;
      }
      #status[data-kind='ok'] {
        border-color: #059669;
        background: #ecfdf5;
      }
      #status[data-kind='warn'] {
        border-color: #d97706;
        background: #fffbeb;
      }
      #status[data-kind='off'] {
        background: #f9fafb;
      }
      .muted {
        color: #6b7280;
        font-size: 12px;
      }
      ul {
        margin: 6px 0 0;
        padding-left: 18px;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>📚 CampusSchedule Importer</h1>
    <div id="status" data-kind="off">
      <div data-pane="detecting">正在检测当前页面…</div>
      <div data-pane="notab" hidden>无法获取当前标签页。</div>
      <div data-pane="off" hidden>
        当前页面不是受支持的学校教务页面。
        <div class="muted">请打开广东轻工职业技术大学教务系统相关页面。</div>
      </div>
      <div data-pane="login" hidden>
        检测到登录页。
        <div class="muted">请先自行完成登录；本扩展不会读取任何输入内容。</div>
      </div>
      <div data-pane="ok" hidden>
        已识别 <strong data-field="school"></strong> 课表页面 ✅
        <div class="muted">解析功能将在导入工作流开放。</div>
      </div>
      <div data-pane="warn" hidden>
        已进入 <strong data-field="school"></strong> 域，但当前页面还不是课表页面。
        <ul data-field="reasons"></ul>
      </div>
    </div>
    <p class="muted">
      请自行打开学校教务系统并登录，进入"学期课表"页面后，从此处触发解析。
      本扩展不保存学校账号、密码、验证码或 Cookie。
    </p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
